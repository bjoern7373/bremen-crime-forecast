name: Daily data update

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC = 06:00/07:00 Bremen time
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python src/scrape.py --no-cache
          python src/build_dataset.py
          python src/build_external_features.py
          python src/geocode.py
          python src/find_series.py
          python src/export_map_data.py
          cp assets/map_data.json docs/map_data.json

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/geocode_cache data/processed docs/map_data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Daily data update"
          git push
