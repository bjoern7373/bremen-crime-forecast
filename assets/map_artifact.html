    color: #333;
    padding: 1px 5px;
    border-radius: 4px;

  .marker {

    transform: translate(-50%, -50%);

    width: 12px; height: 12px;

    el.style.left = leftPct + "%";
    el.style.top = topPct + "%";

    el.addEventListener("mouseenter", function (ev) { showTooltip(ev, d, cat); });
    el.addEventListener("mousemove", function (ev) { positionTooltip(ev); });
    el.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });

    markerLayer.appendChild(el);
    markers.push({ el: el, data: d });
  });

  function showTooltip(ev, d, cat) {
    tooltip.innerHTML =
      '<div class="t-title">' + escapeHtml(d.title) + '</div>' +
      '<div class="t-meta">' + escapeHtml(cat.label) + ' · ' + escapeHtml(d.date || "") + '</div>' +
      '<div class="t-meta">' + escapeHtml(d.ort || d.stadtteil || "") + '</div>' +
      '<div class="t-prec">' + (d.prec === "a" ? "genaue Adresse" : "nur Stadtteil-Angabe (ungefähre Lage)") + '</div>';
    tooltip.style.display = "block";
    positionTooltip(ev);
  }
  function positionTooltip(ev) {
    var rect = mapFrame.getBoundingClientRect();
    var x = ev.clientX - rect.left + 14;
    var y = ev.clientY - rect.top + 14;
    if (x + 240 > rect.width) x = ev.clientX - rect.left - 254;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---- legend ----
  var legendList = document.getElementById("legendList");
  var counts = {};
  Object.keys(CATS).forEach(function (k) { counts[k] = 0; });
  DATA.forEach(function (d) { counts[d.cat] = (counts[d.cat] || 0) + 1; });

  Object.keys(CATS).forEach(function (key) {
    var cat = CATS[key];
    var row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML =
      '<span class="legend-swatch" style="background:' + cat.color + '">' + cat.code + '</span>' +
      '<span class="legend-label">' + cat.label + '</span>' +
      '<span class="legend-count">' + (counts[key] || 0) + '</span>';
    row.addEventListener("click", function () {
      activeCats[key] = !activeCats[key];
      row.classList.toggle("off", !activeCats[key]);
      applyFilters();
    });
    legendList.appendChild(row);
  });

  // ---- filters ----
  var rangeSelect = document.getElementById("rangeSelect");
  var precSelect = document.getElementById("precSelect");
  rangeSelect.addEventListener("change", applyFilters);
  precSelect.addEventListener("change", applyFilters);

  function applyFilters() {
    var rangeVal = rangeSelect.value;
    var precVal = precSelect.value;
    var cutoff = null;
    if (rangeVal !== "all") {
      var d = new Date();
      d.setDate(d.getDate() - parseInt(rangeVal, 10));
      cutoff = d;
    }
    var visible = 0;
    markers.forEach(function (m) {
      var ok = activeCats[m.data.cat];
      if (ok && cutoff && m.data.date) {
        var dd = new Date(m.data.date);
        if (dd < cutoff) ok = false;
      }
      if (ok && precVal !== "all" && m.data.prec !== precVal) ok = false;
      m.el.hidden = !ok;
      if (ok) visible++;
    });
    document.getElementById("stats").textContent = visible + " von " + DATA.length + " Vorfällen angezeigt";
  }

  applyFilters();
})();
</script>
